name: RAG 知识库同步

# ⚠️ 2026-09-30 方案 C 决策（commit 231de2b）：CI checkout 内无知识源（docs/docx gitignored），
# 本 workflow 的 push / schedule 触发均为空转轮——workflow 层 success、sync 层 partial、scannedFileCount=0
# （2026-09-29 首跑与 2026-10-30 schedule run 41138923320 实测一致）。
# 按决策保留空转留档，不作为现行同步入口；唯一同步事实源 = 本地 CLI rag:sync（packages/ai-rag-api）。
# SY-1（learn-agents-ui plan 18.3）：知识库同步 GA 调度承担方。
# 规格依据：openspec/changes/2026-09-29-ga-knowledge-sync-schedule delta（该路径已清退；归档件：reports/2026-9-5-learn-inkeep-agents-repo/learn-agents-ui/openspec-archive/2026-09-29-ga-knowledge-sync-schedule.md）
# Requirement 8（push 增量 + schedule 兜底 + workflow_dispatch 手动；
# 管线复用 rag:sync 零代码改动；8 类 NITRO_ Secrets 前提；不可并发纪律）。
# 注意：不在 Vercel 侧配置 Cron（2026-08-07 决策）。（历史注释：方案 C 决策后本文件保留空转留档，唯一同步事实源为本地 rag:sync）

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  schedule:
    - cron: "30 18 * * *" # UTC 18:30 = 北京 02:30 低峰；增量轮仅哈希对比，成本极低
  workflow_dispatch: {}

concurrency:
  group: rag-sync
  cancel-in-progress: false # 同步不可并发（advisory lock 语义在 CI 外的兜底）

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5 # 读取根 package.json packageManager（pnpm@12.4.1）
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ruan-cat-drill-doc/ai-rag-core build
      - run: pnpm --filter @ruan-cat-drill-doc/ai-rag-api run rag:sync
        env:
          NITRO_DATABASE_URL: ${{ secrets.NITRO_DATABASE_URL }}
          NITRO_SYNC_DATABASE_URL: ${{ secrets.NITRO_SYNC_DATABASE_URL }} # 必须 non-pooled 直连串（advisory lock 正确性要求）
          NITRO_EMBEDDING_MODEL: ${{ secrets.NITRO_EMBEDDING_MODEL }}
          NITRO_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NITRO_CLOUDFLARE_ACCOUNT_ID }}
          NITRO_CLOUDFLARE_API_TOKEN: ${{ secrets.NITRO_CLOUDFLARE_API_TOKEN }}
          NITRO_KNOWLEDGE_SYNC_TOKEN: ${{ secrets.NITRO_KNOWLEDGE_SYNC_TOKEN }} # 装配门禁变量，非空即可
          NITRO_CRON_SECRET: ${{ secrets.NITRO_CRON_SECRET }} # 装配门禁变量，非空即可
          NITRO_ANTHROPIC_API_KEY: ${{ secrets.NITRO_ANTHROPIC_API_KEY }} # 按激活 provider；切 OpenAI 时换 NITRO_OPENAI_API_KEY
