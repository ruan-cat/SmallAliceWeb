name: 文档站生产构建自检

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 生产构建链路自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.29.2
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: 启用 Corepack
        run: corepack enable
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: 生产构建
        run: pnpm run build
      - name: 类型检查
        run: pnpm run typecheck
