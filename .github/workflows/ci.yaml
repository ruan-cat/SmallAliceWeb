name: 文档站生产构建自检

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 生产构建链路自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.29.2
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: 启用 Corepack
        run: corepack enable
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: 记录构建前内存
        run: |
          node -e "const v8=require('node:v8'); console.log('V8 heap limit MiB:', Math.round(v8.getHeapStatistics().heap_size_limit / 1024 / 1024))"
          free -h
      - name: 生产构建
        run: |
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v pnpm run build
          else
            pnpm run build
          fi
