name: API 发布到 Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "packages/ai-rag-api/**"
      - "packages/ai-rag-core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-cloudflare-worker.yaml"

concurrency:
  group: api-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 构建并上传 API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: 生产构建
        run: pnpm --filter @ruan-cat-drill-doc/ai-rag-api run build:cloudflare
      - name: 上传 Worker
        working-directory: packages/ai-rag-api/.output/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3412269ab0def154c8806e38acd1b493"
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: |
          npm install --global wrangler@4.131.1
          "$(npm prefix --global)/bin/wrangler" deploy
