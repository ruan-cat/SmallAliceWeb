name: 云端 PR Prettier 格式化

on:
  # 只在 PR 生命周期中触发；不要替换为 pull_request_target，以免向不受信任代码授予写权限。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  # 同仓 PR 的格式化结果需要写回 head 分支；fork PR 会被 job 条件安全跳过。
  contents: write
  pull-requests: read

concurrency:
  group: cloud-pr-prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-pr:
    name: 格式化同仓 PR 改动
    # fork PR 不执行带写权限的 job，避免执行不受信任代码后推送到其他仓库。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # 环境初始化按 sxzz setup-js 的可迁移顺序执行：checkout PR head → pnpm → Node → 安装依赖。
      # Action 版本固定为本仓库 ci.yaml 已审查使用的版本；pnpm 版本由 action 自动读取 package.json#packageManager。
      - name: 检出 PR head 提交
        uses: actions/checkout@v6
        with:
          # sxzz 模板需二次 detach 覆盖检出；actions/checkout 直接支持 ref，一步检出到 PR head（detached HEAD），防止把 merge commit 推回来源分支。
          ref: ${{ github.event.pull_request.head.sha }}
          # 拉取完整历史，保证 base.sha...HEAD 三点 diff 能找到 merge-base。
          fetch-depth: 0
          # 后续需要以 github-actions[bot] 身份推回 head 分支。
          persist-credentials: true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5 # 版本输入留空，自动读取 package.json#packageManager（pnpm@10.29.2）

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          # 默认对齐 engines.node 与 ci.yaml 的 22.x；可用仓库变量 NODE_VERSION 覆盖。
          node-version: ${{ vars.NODE_VERSION || '22.x' }}
          cache: pnpm

      # 在安装前验证目标仓库具备独立、可复现运行所需的最小元数据。
      - name: 检查独立运行前提
        shell: bash
        run: |
          test -f package.json || { echo "缺少 package.json，无法识别 Node.js 项目。"; exit 1; }
          test -f pnpm-lock.yaml || { echo "缺少 pnpm-lock.yaml；请先提交锁文件，或经维护者审查后修改安装策略。"; exit 1; }
          grep -Eq '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json || { echo "package.json#packageManager 必须声明 pnpm@版本，才能保证可复现的独立工作流。"; exit 1; }

      # 依赖必须在已检出的 PR head 上无条件安装；不得依赖 auto-install 或通过条件跳过依赖安装。
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 仅格式化 PR 修改文件
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              # 锁文件禁止进入格式化提交；必须先于 *.yaml 规则匹配。
              pnpm-lock.yaml) ;;
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts|*.json|*.jsonc|*.md|*.mdx|*.yaml|*.yml|*.css|*.scss|*.less)
                files+=("$file") ;;
            esac
          done < <(git diff --name-only -z --diff-filter=ACMRTUXB "$BASE_SHA...HEAD")

          if ((${#files[@]} == 0)); then
            echo "PR 中没有需要 Prettier 处理的文件。"
            exit 0
          fi

          for file in "${files[@]}"; do
            pnpm exec prettier --experimental-cli --no-parallel --write -- "$file"
          done

          git add -- "${files[@]}"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Prettier 未产生格式化改动。"
            exit 0
          fi

          # 只提交上面精确暂存的 PR 文件；禁止使用 git add . 吞入无关改动。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: 自动格式化 PR 改动"
          # checkout 使用 head SHA（detached HEAD），因此明确将 HEAD 推送回 PR 的 head 分支。
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
